name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Privacidade e testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Varredura de privacidade
        run: npm run privacidade
      - name: Instalar o Chromium dos testes
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (celular e computador)
        run: npm test
      - name: Guardar o relatório se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
